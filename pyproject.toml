[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gldtk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "anthropic>=0.40",
]

[project.optional-dependencies]
server = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8",
    "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["symbolic*", "layout*", "llm*", "aesthetic*", "api*", "spec*", "game*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: real-provider calls (network, API keys); run with `pytest -m e2e`",
]
addopts = "-m 'not e2e'"
